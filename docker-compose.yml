services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clipshare}
      MYSQL_USER: ${MYSQL_USER:-clipshare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - '${MYSQL_PORT:-3306}:3306'

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - clipshare

volumes:
  mysql_data:
    name: clipshare_mysql_data

networks:
  clipshare:
    name: clipshare_network
